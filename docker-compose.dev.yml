# 本地开发只运行后端容器；前端必须在宿主机用 Vite 热更新。
#
# 启动后端：
#   docker compose -f docker-compose.dev.yml up -d
# 启动前端：
#   cd frontend && npm run dev
# 浏览器统一访问：http://127.0.0.1:8080

services:
  backend:
    image: beaver-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: beaver-backend-dev
    restart: unless-stopped
    platform: linux/amd64
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    environment:
      - DATABASE_URL=sqlite:///app/data/app.db
      - SECRET_KEY=REDACTED_SECRET_REMOVED
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
