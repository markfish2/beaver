<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/beaver.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="color-scheme" content="dark light">
    <title>Beaver - 轻量个人知识库</title>
    
    <!-- ==================== PWA 核心配置 ==================== -->
    <meta name="application-name" content="Beaver">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- ==================== iOS Safari 全屏模式 ==================== -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Beaver">
    <meta name="color-scheme" content="light dark">
    
    <!-- iOS 图标 (PNG 格式) -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    
    <!-- ==================== Android / Chrome 全屏模式 ==================== -->
    <!-- 状态栏沉浸：改为白色与应用顶部背景色融合 -->
    <meta name="theme-color" content="#f7f6f2">
    
    <!-- ==================== Windows / Microsoft ==================== -->
    <meta name="msapplication-TileColor" content="#ffffff">
    <meta name="msapplication-TileImage" content="/icons/icon-144x144.png">
    <meta name="msapplication-tap-highlight" content="no">
    
    <!-- ==================== 其他优化 ==================== -->
    <!-- 禁止电话号码自动检测 -->
    <meta name="format-detection" content="telephone=no">
  </head>
  <body>
    <!-- Capacitor SQLite Web 平台支持 -->
    <jeep-sqlite></jeep-sqlite>
    <div id="root"></div>
    <!-- iOS PWA 恢复：在 React 渲染前同步恢复滚动位置，避免刷新后跳到顶部 -->
    <script>
      try {
        var sy = sessionStorage.getItem('mf-scroll-y');
        if (sy) {
          // 立即设置 CSS 防止闪烁，React 挂载后再恢复到 .main-content-area
          window.__mf_scroll_restore = Number(sy);
        }
      } catch(e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
